name: Mirror Docker Images to CNB

on:
  push:
    branches: [main]
    paths:
      - '.github/images.yaml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      image:
        description: 'Optional: single source image to sync (e.g. docker.io/library/mysql:8.4). Leave blank to sync all from images.yaml'
        required: false
        type: string

jobs:
  mirror:
    name: >-
      Mirror ${{ github.event.inputs.image || 'All Images' }}
    runs-on: ubuntu-latest
    env:
      TARGET_REGISTRY: docker.cnb.cool/youvigo/base

    steps:
      - uses: actions/checkout@v6

      - name: Login to Docker Hub (optional)
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USER" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "$DOCKERHUB_TOKEN" | skopeo login -u "$DOCKERHUB_USER" --password-stdin docker.io
          else
            echo "Docker Hub credentials not set, using anonymous pulls."
          fi

      - name: Sync single image (manual override)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.image != '' }}
        run: |
          set -euo pipefail
          src="${{ inputs.image }}"
          name_tag="${src##*/}"
          target="${TARGET_REGISTRY}/${name_tag}"

          echo "Mirroring single image: ${src} -> ${target}"
          skopeo copy --all --retry-times 3 \
            --dest-creds "cnb:${{ secrets.CNB_TOKEN }}" \
            "docker://${src}" \
            "docker://${target}"
          echo "::notice title=Image Published::${target}"

      - name: Sync all images from images.yaml
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.image == '' }}
        run: |
          set -euo pipefail
          skopeo sync \
            --src yaml \
            --dest docker \
            --all \
            --retry-times 3 \
            --dest-creds "cnb:${{ secrets.CNB_TOKEN }}" \
            "${{ github.workspace }}/.github/images.yaml" \
            "${TARGET_REGISTRY}"
